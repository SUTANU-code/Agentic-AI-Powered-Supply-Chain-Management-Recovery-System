# === Application ===
spring.application.name=supplychain-ai

# === Server ===
server.port=${SERVER_PORT:8080}

# === PostgreSQL ===
# Override these with real env vars in any shared/deployed environment.
# Defaults below assume a local Postgres with a database already created:
#   CREATE DATABASE supplychain_ai;
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/supplychain_ai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:mysqlexpress}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
# 'update' auto-creates/updates tables from your entities - good for dev.
# Switch to 'validate' once schema is stable, and manage changes via migrations.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Controllers currently return JPA entities straight from the repositories (see the
# "Architecture notes" section of the README) rather than mapping them to DTOs first.
# Keeping open-in-view on lets lazy associations (Order.customer, Incident.relatedOrder,
# etc.) resolve during JSON serialization without a LazyInitializationException. This is
# set explicitly (instead of relying on Spring Boot's implicit default) so the intent is
# documented and the startup warning is silenced. Move to response DTOs, then flip this
# to false — see README.
spring.jpa.open-in-view=true

# === JWT ===
# Replace with a long, random secret via the JWT_SECRET env var before any real deployment.
# Generate one with: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:CHANGE_ME_supplychain_ai_dev_secret_key_please_replace_before_demo_day_0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# === CORS ===
# Comma-separated list of origins allowed to call this API from a browser (e.g. your
# React dev server). Override with CORS_ALLOWED_ORIGINS in other environments.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# === Actuator (health checks) ===
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

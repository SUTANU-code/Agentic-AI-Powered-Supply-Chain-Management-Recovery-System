# Test configuration - runs on in-memory H2 database with PostgreSQL compatibility
spring.datasource.url=jdbc:h2:mem:supplychain_ai_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT test secret (>= 256 bits) and configuration
app.jwt.secret=test_jwt_secret_key_for_testing_purposes_only_needs_to_be_at_least_256_bits_long_0123456789
app.jwt.expiration-ms=3600000

# CORS
app.cors.allowed-origins=http://localhost:3000